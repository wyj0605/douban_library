<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>豆瓣+图书馆查询助手</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          sans-serif;
        color: #222;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(120deg, #087c34, #31a65c);
        color: #fff;
        padding: 12px 15px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .brand img {
        width: 34px;
        height: 34px;
      }
      h1 {
        font-size: 17px;
        margin: 0;
      }
      button {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: transparent;
        color: #fff;
        border-radius: 7px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      button::before {
        content: "";
        width: 14px;
        height: 14px;
        background: currentColor;
        mask: url("icons/gear.svg") center/contain no-repeat;
      }
      main {
        padding: 16px;
        min-height: 105px;
      }
      .selected-library {
        position: relative;
        margin: 8px 0;
        padding: 11px 11px 11px 40px;
        border: 1px solid #dceadd;
        border-radius: 9px;
        background: #f0f8f2;
        color: #087c34;
        font-weight: 650;
      }
      .selected-library::before {
        content: "";
        position: absolute;
        left: 13px;
        top: 13px;
        width: 17px;
        height: 17px;
        background: #159346;
        mask: url("icons/building-columns.svg") center/contain no-repeat;
      }
      footer {
        text-align: center;
        background: #f5f6f5;
        padding: 9px;
        color: #777;
      }
      a {
        color: #087c34;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="img/book_128.png" alt="" />
          <h1>豆瓣+图书馆查询助手</h1>
      </div>
      <button id="openOptions">设置</button>
    </header>
    <main><div id="provinceList">正在读取…</div></main>
    <footer>
      <a href="https://navy82.icu/" target="_blank">navy82.icu</a>
    </footer>
    <script src="popup.mjs" type="module"></script>
  </body>
</html>
