<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查书助手</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 顶栏 -->
    <header class="app-header">
        <div class="header-inner">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <path fill="currentColor" d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM6 4h5v8l-2.5-1.5L6 12V4zm12 16H6v-2h12v2zm0-4H6v-2h12v2zm0-4h-5V4h5v8z"/>
                </svg>
                <h1>查书助手</h1>
            </div>
            <button id="settingsBtn" class="icon-btn" title="选择查询图书馆">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="currentColor" d="M19.14 12.94a7.4 7.4 0 0 0 .05-.94 7.4 7.4 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.25-1.12.57-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.39.31.61.22l2.39-.96c.5.37 1.04.69 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.25 1.12-.57 1.62-.94l2.39.96c.22.09.48.01.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-main">
        <!-- 搜索区 -->
        <section class="search-panel">
            <div class="search-row">
                <input id="searchInput" class="search-input" type="text"
                    placeholder="输入书名或 ISBN 进行查询，如：活着 或 9787506365437"
                    autofocus spellcheck="false">
                <button id="searchBtn" class="primary-btn">查询</button>
            </div>
            <div class="lib-row">
                <span class="lib-label">查询图书馆：</span>
                <span id="libChips" class="lib-chips"><span class="empty-hint">请先在设置中选择图书馆</span></span>
            </div>
        </section>

        <!-- 状态区 -->
        <div id="status" class="status" hidden></div>

        <!-- 结果区 -->
        <section id="results" class="results" aria-live="polite"></section>
    </main>

    <footer class="app-footer">
        数据来源：全国各大图书馆公开馆藏信息 · 豆瓣+图书馆查询助手
    </footer>

    <script src="provinces.js"></script>
    <script src="app.js"></script>
</body>
</html>
