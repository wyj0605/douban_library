<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>查书助手设置</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#202420;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}header{background:linear-gradient(120deg,#087c34,#31a65c);color:#fff;padding:24px}.wrap{max-width:1040px;margin:auto}h1{margin:0 0 4px;font-size:26px}header p{margin:0;opacity:.88}.panel{background:#fff;margin:24px auto;padding:22px;border-radius:14px;box-shadow:0 6px 22px rgba(15,70,34,.07)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}input[type=search]{flex:1;min-width:240px;border:1px solid #ccd5ce;border-radius:9px;padding:11px 13px;font:inherit}button{border:1px solid #ccd5ce;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}button:hover{background:#edf7f0}.count{color:#087c34;font-weight:650}.notice{color:#087c34;min-height:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.library-option{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:9px;padding:11px;border:1px solid #e2e7e3;border-radius:9px;cursor:pointer}.library-option:has(input:checked){border-color:#27a153;background:#f1faf4}.library-option small{color:#8a918c}.library-option:has(input:disabled){opacity:.52;cursor:not-allowed}footer{text-align:center;color:#717771;padding:10px 20px 30px}footer a{color:#087c34}</style></head><body>
<header><div class="wrap"><h1>📚 豆瓣+图书馆查询助手</h1><p>最多选择两个图书馆，修改后自动保存。</p></div></header>
<main class="wrap panel"><div class="toolbar"><input id="librarySearch" type="search" placeholder="搜索图书馆名称或编号" autocomplete="off"><label><input id="onlySelected" type="checkbox"> 只看已选</label><button id="resetSelection">恢复默认</button><button id="refreshLibraries">更新列表</button><span id="selectedCount" class="count"></span></div><div id="notice" class="notice" role="status"></div><div id="provinceList" class="grid"></div></main>
<footer>© 2026 <a href="https://navy82.icu/" target="_blank">无理数</a> · <a href="https://github.com/wyj0605/douban_library" target="_blank">GitHub</a></footer><script src="options.mjs" type="module"></script></body></html>
