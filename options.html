<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>查书助手设置</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#202520;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}header{background:linear-gradient(125deg,#06662d,#25a558);color:#fff;padding:26px 24px;box-shadow:0 5px 20px rgba(6,75,31,.16)}.wrap{max-width:1080px;margin:auto}.brand{display:flex;align-items:center;gap:14px}.brand img{width:54px;height:54px;filter:drop-shadow(0 4px 7px rgba(0,0,0,.17))}h1{margin:0 0 2px;font-size:26px}.brand p{margin:0;opacity:.88}.panel{background:#fff;margin:24px auto;padding:24px;border:1px solid #e3e9e4;border-radius:16px;box-shadow:0 8px 28px rgba(15,70,34,.07)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.search-box{position:relative;flex:1;min-width:260px}.search-box::before,.icon{content:"";display:inline-block;width:16px;height:16px;background:currentColor;mask:center/contain no-repeat;vertical-align:-2px}.search-box::before{position:absolute;left:14px;top:14px;color:#78837b;mask-image:url("icons/magnifying-glass.svg")}input[type=search]{width:100%;border:1px solid #cbd6ce;border-radius:10px;padding:11px 13px 11px 40px;font:inherit;outline:0}input[type=search]:focus{border-color:#259d50;box-shadow:0 0 0 3px rgba(37,157,80,.13)}button{display:inline-flex;align-items:center;gap:7px;border:1px solid #cbd6ce;background:#fff;color:#334038;border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit}button:hover{background:#edf7f0;color:#086a31;border-color:#9fc9aa}.icon-reset{mask-image:url("icons/arrow-rotate-right.svg")}.icon-refresh{mask-image:url("icons/arrow-rotate-right.svg")}.filter{display:flex;align-items:center;gap:7px;padding:8px 5px;color:#49534c}.count{color:#087c34;font-weight:700}.notice{color:#087c34;min-height:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.library-option{position:relative;display:grid;grid-template-columns:23px 30px 1fr auto;align-items:center;gap:9px;padding:13px 12px;border:1px solid #e0e7e1;border-radius:11px;background:#fff;cursor:pointer;transition:border-color .18s,background .18s,box-shadow .18s,transform .18s}.library-option::before{content:"";width:20px;height:20px;background:#738079;mask:url("icons/building-columns.svg") center/contain no-repeat}.library-option:hover{color:#202520!important;background:#f6faf7;border-color:#aed0b7;box-shadow:0 4px 12px rgba(13,92,43,.08);transform:translateY(-1px)}.library-option:hover span,.library-option:hover small{color:inherit!important}.library-option:has(input:checked){border-color:#25a558;background:#eff9f2;box-shadow:0 0 0 2px rgba(37,165,88,.09)}.library-option:has(input:checked)::before{background:#087c34}.library-option input{width:18px;height:18px;margin:0;accent-color:#159346}.library-option span{font-weight:600;min-width:0}.library-option small{color:#89918b;white-space:nowrap}.library-option:has(input:disabled){opacity:.48;cursor:not-allowed;transform:none;box-shadow:none}footer{text-align:center;color:#717771;padding:10px 20px 30px}footer a{color:#087c34}.fa-note{font-size:12px;color:#929892;margin-top:16px;text-align:right}
.library-group{grid-column:1/-1;margin:16px 0 0;padding:0 2px 8px;border-bottom:1px solid #e1e8e2;color:#42604b;font-size:16px}.library-group:first-child{margin-top:0}
</style></head><body>
<header><div class="wrap brand"><img src="img/book_128.png" alt=""><div><h1>豆瓣+图书馆查询助手</h1><p>选择常用图书馆，最多同时查询两个馆。</p></div></div></header>
<main class="wrap panel"><div class="toolbar"><div class="search-box"><input id="librarySearch" type="search" placeholder="搜索图书馆名称或编号" autocomplete="off"></div><label class="filter"><input id="onlySelected" type="checkbox">只看已选</label><button id="resetSelection"><i class="icon icon-reset"></i>恢复默认</button><button id="refreshLibraries"><i class="icon icon-refresh"></i>更新列表</button><span id="selectedCount" class="count"></span></div><div id="notice" class="notice" role="status"></div><div id="provinceList" class="grid"></div><div class="fa-note">界面图标来自 Font Awesome Free</div></main>
<footer>© 2026 <a href="https://navy82.icu/" target="_blank">无理数</a> · <a href="https://github.com/wyj0605/douban_library" target="_blank">GitHub</a></footer><script src="options.mjs" type="module"></script></body></html>
